<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Beaufoo Lyrics</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main id="lyrics">
        <!-- Lyrics akan dirender oleh JavaScript -->
    </main>

    <!-- Kontrol bawah: Offset & Romaji -->
    <div id="controls-container">

        <button
            id="offset-minus"
            class="ctrl-btn"
            type="button"
            title="Percepat lirik 0.5 detik"
            aria-label="Percepat lirik 0.5 detik"
        >
            -0.5s
        </button>

        <div class="romaji-wrapper">
            <button
                id="toggle-romaji"
                type="button"
                title="Toggle Romaji Mode"
                aria-label="Toggle Romaji Mode"
            >
                R
            </button>

            <span
                id="offset-indicator"
                class="offset-badge hidden"
                aria-live="polite"
            >
                0.0s
            </span>
        </div>

        <button
            id="offset-plus"
            class="ctrl-btn"
            type="button"
            title="Lambatkan lirik 0.5 detik"
            aria-label="Lambatkan lirik 0.5 detik"
        >
            +0.5s
        </button>

    </div>

    <!-- Force reload -->
    <button
        id="btn-reload"
        type="button"
        title="Force Reload Lyrics"
        aria-label="Force Reload Lyrics"
    >
        ↻
    </button>

    <script src="../src/utils/bridge.js"></script>
    <script src="app.js"></script>

</body>
</html>
