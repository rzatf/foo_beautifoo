<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Beaufoo Lyrics</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main id="lyrics">
        <!-- Lyrics akan dirender oleh JavaScript -->
    </main>

    <!-- Tombol Toggle Romaji -->
    <button id="toggle-romaji" title="Toggle Romaji Mode">R</button>
    <script src="../src/utils/bridge.js"></script>

    <script src="app.js"></script>
    <!-- Tambahkan script ini sebelum tag tutup </body> di index.html -->
<script>
    // Auto-reload sederhana untuk development via XAMPP
    setInterval(() => {
        fetch(window.location.href, { method: 'HEAD' })
            .then(res => {
                // Bisa dikustomisasi atau biarkan kosong jika pakai Live Server standar
            }).catch(() => {});
    }, 2000);
</script>
</body>
