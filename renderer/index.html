<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Beaufoo Lyrics</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main id="lyrics">
        <!-- Lyrics akan dirender oleh JavaScript -->
    </main>

    <!-- Kontainer Tombol Kontrol (Offset & Romaji) -->
    <div id="controls-container">
        <button id="offset-minus" class="ctrl-btn" title="(-0.5s)">-0.5s</button>
        
        <div class="romaji-wrapper">
            <button id="toggle-romaji" title="Toggle Romaji Mode">R</button>
            <span id="offset-indicator" class="offset-badge hidden">0.0s</span>
        </div>

        <button id="offset-plus" class="ctrl-btn" title="(+0.5s)">+0.5s</button>
    </div>

    <script src="../src/utils/bridge.js"></script>
    <script src="app.js"></script>

    <!-- Auto-reload sederhana untuk development via XAMPP -->

        setInterval(() => {
            fetch(window.location.href, { method: 'HEAD' })
                .then(res => {}).catch(() => {});
        }, 2000);
    </script> -->
</body>
</html>
